spring:
  application:
    name: HAB-card-generator

# Label background color (hex value without #, e.g., FFFF00 for yellow)
label:
  background:
    color: 9fd6e0

# Column header names of the Assistonline member export.
# The address column (street + house number [+ bus] in one cell) is split automatically.
card:
  data:
    year: "2025"
    splitOddEven: true
    useNewLine: true
    smallStreetsLast: false
    # Convert names written entirely in upper case (JAN KERREMANS) to title case (Jan Kerremans)
    titleCaseUpperCaseNames: true
    inputDirectory: "C:/03-resources/Hoge Akkersbloei/members"
    outputDirectory: "C:/03-resources/Hoge Akkersbloei/members"
    columns:
      memberId: 'Lidnr.'
      name: 'Voornaam + naam'
      address: 'Adres'
